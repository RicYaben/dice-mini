[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dice-mini"
version = "0.2.0"
description = "DICE mini"
authors = [{ name = "Ricardo Yaben", email = "rmyl@dtu.dk" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas", # dice
    "numpy", # dice
    "lark",
    "tabulate",
    "tqdm",
    "ujson",
    "pyarrow",
    "typer",
    "sqlmodel",
    "dacite",
    "cryptography",
    "tomlkit"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["dice", "dice.*", "modules", "modules.*", "commands", "commands.*"]
exclude = ["analysis", "analysis.*"]

[project.urls]
Homepage = "https://github.com/RicYaben/dice-mini"
Issues = "https://github.com/RicYaben/dice-mini/issues"

[project.optional-dependencies]
analysis = [
    "plotly",
    "squarify",
    "netgraph",
    "hilbertcurve",
]

[project.scripts]
dice-mini = "commands.main:main"
